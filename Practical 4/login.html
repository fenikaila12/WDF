<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Login</title>
    <link rel="stylesheet" href="login.css">
    
</head>
<body>
     <button id="themeToggle" class="theme-button">
    🌙
</button>
<div class="container">

    <div class="left">
        <h1>STUDENTHUB</h1>

        <h2>Welcome Back!</h2>

        <p>Manage your courses, assignments,<br>attendance and results in one place.</p>
    </div>
    <div class="right">
        <form onsubmit="return validateLoginForm()">
            <h2>Login</h2>
            <div>
            <input type="text" id="txtname" placeholder="Email or Username" onclick="validateLoginForm()" ><span id="s"></span>

            <input type="password" id="txtpassword"  placeholder="Password" onclick="validateLoginForm()" ><span id="s1"></span>
            
           <div class="show-password">
             <input type="checkbox" id="showPassword">
            Show Password
            </div>
            <button type="submit" class="button">Login</button>

            <a href="#">Forgot Password?</a><br><br>
            <p>Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </form>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
