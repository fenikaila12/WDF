<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body bgcolour="white">
        <form>
            <table align="center" width="800" cellpadding="10">
                <tr>
                    <td colspan="2" align="center">
                        <h1>Student Registration Form</h1>
                    </td>
                </tr>

            <tr>
                <td>Student Name :</td>
                <td>
                    <input type="text" size="20" placeholder="First Name"/>
                    <input type="text" size="20" placeholder="middle name"/>
                    <input type="text" size="20" placeholder="last name"/>
                </td>
            </tr>

            <tr>
                <td>Date Of Birth :</td>
                <td>
                    <input type="text" size="3" placeholder="Day" />
                    <input type="text" size="3" placeholder="Month" />
                    <input type="text" size="3" placeholder="year" />
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input type="text" size="1" placeholder="+91"/>
                    <input type="text" size="40"/>
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="text" size="50"/>
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password" size="50"/>
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="g" />Male
                    <input type="radio" name="g" />Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox" />CSE
                    <input type="checkbox" />CE
                    <input type="checkbox" />IT
                    <input type="checkbox" />CL
                    <input type="checkbox" />EC
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option> ------------------------Select Course------------------------- </option>
                        <option>Python</option>
                        <option>Java</option>
                        <option>DSA</option>
                        <option>WDE</option>
                        <option>PHP</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student Photo :</td>
                <td>
                    <input type="file" />
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text" size="50" />
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea cols="45" rows="5"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register" />
                </td>
            </tr>

            </table>
        </form>
    </body>
</html>
